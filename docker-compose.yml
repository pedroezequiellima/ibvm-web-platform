services:
  web:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: ibvm_frontend_dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true